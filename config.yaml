data:
  images_root: /mnt/HD_18T_pt2/prithwijit/pace_backup/pointprompt/Images
  masks_root: /mnt/HD_18T_pt2/prithwijit/pace_backup/pointprompt/Masks
  project_root: /mnt/HD_18T_pt2/prithwijit/bald
  split_seed: 123
  train_frac: 0.80
  val_frac: 0.10
  test_frac: 0.10

prompt_generation:
  num_promptsets_train: 10
  num_promptsets_val: 4
  num_promptsets_test: 4
  min_pairs: 1
  max_pairs: 10
  prompt_seed: 777
  gaussian_sigma: 8

sam:
  checkpoint: /home/prithwijit/BALD/sam_vit_h_4b8939.pth
  model_type: vit_h
  device: cuda:1
  multimask_output: true
  select_by: sam_score

head:
  variant: no_image
  channels_in: 3
  hidden_channels: 16

training:
  batch_size: 64
  num_epochs: 50
  lr: 0.001
  weight_decay: 0.0001
  dice_lambda: 1.0
  num_workers: 8
  amp: true
  early_stop_patience: 10
  logit_clip: 20.0
  target_size: [256, 256]   # all inputs and GT resized to this at load time
  scheduler: cosine          # cosine | plateau | none
  scheduler_min_lr: 1.0e-6  # eta_min for cosine; min_lr for plateau
  scheduler_plateau_patience: 3  # patience for ReduceLROnPlateau only
  prefetch_factor: 2             # DataLoader prefetch per worker

hdf5:
  # Set to true once pack_to_hdf5.py has been run; training will use HDF5 loaders
  use_hdf5: true
  chunk_size: 64                 # samples per HDF5 chunk (match batch size)

laplace:
  enabled: true
  target_layer: final_conv
  approx: diagonal
  prior_precision_grid: [0.0001, 0.001, 0.01, 0.1, 1.0, 10.0]  # tuned on val NLL (for prediction)
  bald_prior_precision: auto    # auto-calibrate to target logit-space std ~2.0 for BALD

wandb:
  enabled: true
  project: laplace-head-sam
  entity: null   # set to your wandb username/team, or leave null
  group: null    # optional run group for experiment organisation
